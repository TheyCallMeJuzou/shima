name: Build APK

# Every push builds debug + signed release APKs (kept as run artifacts).
# A tag "v<versionName>" (e.g. v6.4.2-shima.1) also publishes a Gitea release with the release APK attached.
# Signing key: repo secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.

on:
  push:
    branches: [shima]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write     # Create releases on tags
    steps:
      - name: Checkout (with deagle submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      # No setup caching anywhere: the runner's cache server is unreachable from job containers.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing secrets available: the release APK stays unsigned."; exit 0; fi
          keystore="${RUNNER_TEMP:-/tmp}/shima-signing.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleCompleteNormalDebug assembleCompleteNormalRelease

      - name: Collect APKs
        id: apk
        run: |
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' assembly/src/main/AndroidManifest.xml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp assembly/build/outputs/apk/completeNormal/debug/*.apk "out/shima-$version-debug.apk"
          cp assembly/build/outputs/apk/completeNormal/release/*.apk "out/shima-$version-release.apk"
          ls -l out

      - name: Upload APKs
        uses: actions/upload-artifact@v3
        with:
          name: shima-${{ steps.apk.outputs.version }}-${{ gitea.sha }}
          path: out/*.apk

      - name: Publish Gitea release
        if: startsWith(gitea.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
          TAG: ${{ gitea.ref_name }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -e
          command -v jq > /dev/null || { apt-get update -qq && apt-get install -y -qq jq; }
          if [ "$TAG" != "v$VERSION" ]; then echo "Tag $TAG does not match versionName $VERSION"; exit 1; fi
          notes=$(awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md)
          body=$(jq -n --arg tag "$TAG" --arg name "Shima $VERSION" --arg notes "$notes" '{tag_name: $tag, name: $name, body: $notes}')
          id=$(curl -sfS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d "$body" "$API/releases" | jq -r .id)
          curl -sfS -X POST -H "Authorization: token $TOKEN" -F "attachment=@out/shima-$VERSION-release.apk" \
            "$API/releases/$id/assets?name=shima-$VERSION.apk" > /dev/null
          echo "Released $TAG (release id $id)"
