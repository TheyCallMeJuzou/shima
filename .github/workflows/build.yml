name: Build APK

# GitHub counterpart of .gitea/workflows/build.yml (Gitea only reads .gitea/workflows while that directory exists).
# Every push builds debug + signed release APKs (kept as run artifacts).
# A tag "v<versionName>" (e.g. v6.4.2-shima.1) also publishes a GitHub release with the release APK attached;
# for a tag pushed before this workflow existed, run it manually ("Run workflow") with that tag as input.
# Signing key: repo secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.

on:
  push:
    branches: [shima]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish as a release (e.g. v6.4.2-shima.1); empty = plain build'
        required: false

env:
  # Tag to release: the pushed tag, or the one given to a manual run
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write     # Create releases
    steps:
      - name: Checkout (with deagle submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: true

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/shima' }}

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$RELEASE_TAG" ]; then echo "::error::Releases need the signing secrets"; exit 1; fi
            echo "No signing secrets available: the release APK stays unsigned."; exit 0
          fi
          keystore="$RUNNER_TEMP/shima-signing.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          # Check the secrets fit together now, instead of failing minutes later in packaging (with the alias masked)
          echo "Keystore file SHA-256: $(sha256sum "$keystore" | cut -c1-16)"
          if ! out=$(keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" 2>&1); then
            echo "::error::SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS don't open SIGNING_KEYSTORE_BASE64: $(echo "$out" | tail -1)"; exit 1
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build
        run: ./gradlew --stacktrace assembleCompleteNormalDebug assembleCompleteNormalRelease

      - name: Collect APKs
        id: apk
        run: |
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' assembly/src/main/AndroidManifest.xml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp assembly/build/outputs/apk/completeNormal/debug/*.apk "out/shima-$version-debug.apk"
          cp assembly/build/outputs/apk/completeNormal/release/*.apk "out/shima-$version-release.apk"
          ls -l out

      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -e
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then echo "::error::Tag $RELEASE_TAG does not match versionName $VERSION"; exit 1; fi
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cp "out/shima-$VERSION-release.apk" "out/shima-$VERSION.apk"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then     # Re-run: replace the APK
            gh release upload "$RELEASE_TAG" "out/shima-$VERSION.apk" --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Shima $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
              "out/shima-$VERSION.apk"
          fi
          echo "Released $RELEASE_TAG"

      - name: Upload APKs
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: shima-${{ steps.apk.outputs.version }}-${{ github.sha }}
          path: out/*.apk
